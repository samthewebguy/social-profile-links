<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Social Links Profile Design" />
    <meta
      name="keywords"
      content="Social links profile with HTML and CSS, Frontend Mentor Challenge for Newbies"
    />
    <link rel="icon" href="./Images/favicon-32x32.png" type="image/png">
    <title>Social Links Profile</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="main-section">
      <div class="container">
        <div class="inner-content">

          <!-- Basic Details -->
          <div class="basic-details">
            <img src="Images/avatar-jessica.jpeg" alt="Picture of Jessica" />
            <h2>Jessica Randall</h2>
            <h4>London, United Kingdom</h4>
            <p>"Front-end developer and avid reader."</p>
          </div>

          <!-- Buttons -->
          <div class="socialbtn">
            <a class="github" href="https://github.com" target="_blank">GitHub</a>
            <a class="frontend-mentor" href="https://frontendmentor.io"  target="_blank">Frontend Mentor</a>
            <a class="linkedin" href="https://linkedin.com"  target="_blank">Linkedin</a>
            <a class="twitter" href="https://twitter.com"  target="_blank">Twitter</a>
            <a class="instagram" href="https://instagram.com"  target="_blank">Instagram</a>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
